  <g fill="none" stroke="#39404F" stroke-width="32" stroke-linecap="round">
    <path d="M 340 702 C 252 652 222 468 240 262"/>
    <path d="M 684 702 C 772 652 802 468 784 262"/>
  </g>

  <line x1="218" y1="248" x2="806" y2="248" stroke="#39404F" stroke-width="34"
