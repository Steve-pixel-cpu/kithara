      <stop offset="0%" stop-color="#F4F1E8"/>
      <stop offset="100%" stop-color="#E7E2D4"/>
    </radialGradient>
    <linearGradient id="greenL" gradientUnits="userSpaceOnUse" x1="512" y1="290" x2="512" y2="682">
      <stop offset="0%" stop-color="#1FB377"/>
      <stop offset="100%" stop-color="#148F5C"/>
    </linearGradient>
    <filter id="glowL" x="-300%" y="-300%" width="700%" height="700%">
